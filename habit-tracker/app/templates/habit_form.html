{% extends "base.html" %}
{% block title %}{% if habit %}Редактировать привычку{% else %}Новая привычка{% endif %}{% endblock %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">{% if habit %}Редактировать привычку{% else %}Новая привычка{% endif %}</h2>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Название привычки *</label>
                <input type="text" name="name" class="form-control"
                       value="{{ habit.name if habit else '' }}" required maxlength="100">
            </div>

            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea name="description" class="form-control" rows="3">{{ habit.description if habit else '' }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Целевое количество раз в день *</label>
                <input type="number" name="target_count" class="form-control" min="1"
                       value="{{ habit.target_count if habit else 1 }}" required>
            </div>

            <button type="submit" class="btn btn-success">Сохранить</button>
            <a href="{{ url_for('habits.index') }}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>

{% endblock %}
